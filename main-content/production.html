<!-- =========================
     PRODUCTION MODULE
========================= -->

<!-- Tabs -->
<div class="tab-nav">
    <a href="#" class="tab-link active"
        onclick="switchTab(event,'jobOrderSection')">
        Job Order
    </a>
</div>

<!-- =====================================================
     JOB ORDER TAB
===================================================== -->

<div id="jobOrderSection" class="tab-content active-content">

    <div class="form-section saved-job-order-section">
        <div class="toolbar">
            <h3 class="section-title">Saved Job Orders</h3>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="productionJobOrderStatusSearch">Status</label>
                <select id="productionJobOrderStatusSearch" class="form-control">
                    <option value="">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Approved">Approved</option>
                    <option value="Completed">Completed</option>
                    <option value="Delivered">Delivered</option>
                </select>
            </div>

            <div class="form-group">
                <label for="productionJobOrderTargetDeliveryFilter">Target Delivery Date</label>
                <input type="date" id="productionJobOrderTargetDeliveryFilter" class="form-control" />
            </div>
        </div>

        <div class="quotation-items-table-wrap">
            <table class="clients-table">
                <thead>
                    <tr>
                        <th>Job Order ID</th>
                        <th>Client Name</th>
                        <th>Title</th>
                        <th>Installation Date</th>
                        <th>Target Delivery</th>
                        <th>Date Delivered</th>
                        <th>Tiling</th>
                        <th>Eyelet</th>
                        <th>Bleeding</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="productionSavedJobOrdersTableBody">
                    <tr>
                        <td colspan="10">Loading saved Job Orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
