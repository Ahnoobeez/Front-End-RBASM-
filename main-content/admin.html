<!-- ==========================================
     USER ACCOUNTS
========================================== -->

<div id="userAccountsSection" class="tab-content active-content">

    <div class="admin-user-layout">
    <div class="form-section admin-user-section">
        <h3 class="section-title admin-section-title">Create User Account</h3>

        <div class="admin-user-form-grid">
            <div class="form-group">
                <label for="adminEmployeeNumber">Employee Number</label>
                <select id="adminEmployeeNumber" class="form-control">
                    <option value="">Select an employee</option>
                </select>
            </div>
            <div class="form-group">
                <label for="adminUsername">Username</label>
                <input id="adminUsername" type="text" class="form-control">
            </div>
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input id="adminPassword" type="password" class="form-control">
            </div>
            <div class="form-group">
                <label for="adminConfirmPassword">Confirm Password</label>
                <input id="adminConfirmPassword" type="password" class="form-control">
            </div>
            <div class="form-group">
                <label for="adminEmail">Email</label>
                <input id="adminEmail" type="email" class="form-control">
            </div>
        </div>

        <div class="admin-create-account-action">
            <button class="btn btn-primary" type="button">Create User Account</button>
        </div>
    </div>

    <div class="form-section admin-user-section">
        <h3 class="section-title admin-section-title">Existing User Accounts</h3>
        <div class="admin-user-table-wrap">
            <table class="admin-user-table">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Username</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6">No user accounts found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    </div>

</div>
